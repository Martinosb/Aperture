packages:
  - "apps/*"
  - "packages/*"
# Packages whose install scripts fetch or compile a platform-specific binary.
# esbuild backs tsup; bindings-cpp is the native serial layer; sharp is Next's
# image pipeline.
allowBuilds:
  '@firebase/util': true
  '@serialport/bindings-cpp': true
  esbuild: true
  protobufjs: true
  sharp: true
